<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — Peoplebox Client Portal</title>
  <link rel="icon" href="/sprout-leaf.png"/>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    .login{min-height:100vh;display:grid;place-items:center;padding:24px;}
    .card-login{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:38px 34px;max-width:380px;width:100%;text-align:center;}
    .card-login .leaf{width:46px;height:46px;border-radius:13px;font-size:25px;margin:0 auto 18px;}
    .card-login h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em;}
    .card-login p{color:var(--muted);font-size:13.5px;margin:0 0 26px;line-height:1.5;}
    .gbtn{display:inline-flex;align-items:center;gap:10px;justify-content:center;width:100%;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:600;}
    .gbtn:hover{background:#16664a;}
    .gbtn svg{width:18px;height:18px;background:#fff;border-radius:3px;padding:2px;}
    .err{background:#FCEDED;border:1px solid #F2C9C9;color:#9b2c2c;font-size:12.5px;border-radius:10px;padding:10px 12px;margin-bottom:18px;}
    .fine{color:var(--faint);font-size:11.5px;margin-top:20px;}
  </style>
</head>
<body>
  <div class="login">
    <div class="card-login">
      <div class="leaf"><img src="/sprout-leaf.png" alt="Sprout"/></div>
      <h1>Peoplebox Client Portal</h1>
      <p>Internal access only. Sign in with your Sprout Google account to continue.</p>
      <div id="err" class="err" style="display:none"></div>
      <a class="gbtn" href="/auth/google">
        <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 1.9-1.6 4.8-4.6 6.7l-.04.3 6.7 5.2.5.05C42.9 36.6 45 31 45 24.5"/><path fill="#34A853" d="M24 46c6.1 0 11.2-2 14.9-5.5l-7.1-5.5c-1.9 1.3-4.5 2.3-7.8 2.3-6 0-11-4-12.8-9.5l-.3.02-6.9 5.4-.1.3C7.5 41 15.1 46 24 46"/><path fill="#FBBC05" d="M11.2 27.8c-.5-1.4-.7-2.9-.7-4.3s.3-3 .7-4.3l-.01-.3-7-5.4-.2.1A22 22 0 0 0 2 23.5c0 3.6.9 7 2.4 9.9z"/><path fill="#EA4335" d="M24 9.7c4.2 0 7.1 1.8 8.7 3.4l6.4-6.2C35.2 3.2 30.1 1 24 1 15.1 1 7.5 6 4.4 13.6l6.8 5.3C13 13.7 18 9.7 24 9.7"/></svg>
        Continue with Google
      </a>
      <div class="fine">Restricted to @sprout.ph accounts.</div>
    </div>
  </div>
  <script>
    var msgs={domain:"That account isn't allowed. Use your @sprout.ph email.",oauth:"Sign-in failed. Please try again.",missing_code:"Sign-in was cancelled.",};
    var e=new URLSearchParams(location.search).get("error");
    if(e){var box=document.getElementById("err");box.textContent=msgs[e]||"Sign-in error.";box.style.display="block";}
  </script>
</body>
</html>
